<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Probar API de Notas</title>
	<style>
		* { box-sizing: border-box; padding: 0; margin: 0; }

		:root { color-scheme: dark; scrollbar-width: thin; scrollbar-color: #2c2c2a #1a1a18; }

		.flex { display: flex; gap: .5rem; }

		body {
			display: flex;
			gap: 1rem;
			flex-direction: column;
			min-height: 100dvh;
			max-width: 65ch;
			padding: 2rem 1rem;
			margin-inline: auto;
			background: #1a1a18;
			font-family: Arial, system-ui, sans-serif;
			color: #e8e6e0;
		}

		header.top {
			justify-content: space-between;
			align-items: center;
			font-size: .8rem;
			flex-wrap: wrap;

			h1 { font-size: 1.2rem; font-weight: 500; }
			input { font-family: monospace; field-sizing: content; }
		}

		input, textarea, button {
			padding: .5em 1em;
			border: 1px solid #444441;
			border-radius: .5em;
			background: #2c2c2a;
			font-family: inherit;
			font-size: inherit;
			color: inherit;
			outline-color: #888780;

			&::placeholder { color: #888780; }
		}

		button {
			cursor: pointer;

			&:is(:hover, :focus-visible) { background: #3a3a38; }
			&:not(:disabled):active { scale: 0.98; }
			&:disabled { filter: brightness(62.5%); cursor: auto; }
		}

		section {
			flex-direction: column;

			> header { justify-content: space-between; align-items: end; }
		}

		section h2 {
			color: #5f5e5a; 
			font-size: .675em;
			font-weight: 600;
			text-transform: uppercase;
		}

		form {
			flex-direction: column;
			font-size: .9rem;

			input { flex: 1; }

			/* El atributo `rows` del textarea no funciona con `field-sizing: content` */
			textarea {
				box-sizing: content-box;
				min-block-size: calc(attr(rows) * 1lh);
				field-sizing: content;
				resize: none;
			}
		}

		#apiStatus {
			font-size: .6em;

			&.ok { color: #5dcaa5; }
			&.err { color: #f09595; }
		}

		p.muted { font-size: .75rem; color: #5f5e5a; }

		#noteList { flex-direction: column; }

		.note {
			display: grid;
			gap: .375rem;
			padding: .75rem 1rem;
			border: 1px solid #444441;
			border-radius: .5rem;
			background: #2c2c2a;
			word-break: break-word;

			header { justify-content: space-between; }
			h3 { font-size: 14px; font-weight: 500; color: #e8e6e0; }

			button.delete {
				height: 100%;
				padding: 0;
				border: none;
				background: none;
				font-size: 14px;
				color: #5f5e5a;
				line-height: 0;

				&:hover { color: #f09595; }
			}

			p.body { font-size: 13px; white-space: pre-wrap; color: #888780; }
			time { display: inline-block; font-size: 11px; color: #5f5e5a; }
		}
	</style>
</head>
<body>
	<header class="top flex">
		<h1>Notas</h1>

		<div class="flex">
			<input id="apiUrl" type="url" value="http://localhost:3000" spellcheck="false" />
			<button onclick="connect()">Conectar</button>
		</div>
	</header>

	<section class="flex">
		<h2>Crear nota</h2>
		<form name="noteForm" class="flex" onsubmit="handleFormSubmit(event)" autocomplete="off">
			<div class="flex">
				<input name="title" placeholder="Título" required>
	 			<button name="submit" disabled>Añadir nota</button>
			</div>
			<textarea name="body" rows="2" placeholder="Contenido"></textarea>
		</form>
	</section>

	<section class="flex">
		<header class="flex">
			<h2>Lista</h2>
			<p id="apiStatus" role="status" aria-live="polite"></p>
		</header>

		<div id="noteList" class="flex">
			<p class="muted"><em>Introduce la URL de la API y pulsa Conectar.</em></p>
		</div>
	</section>

	<script>
		let BASE = '';

		function handleFormSubmit(event) {
			event.preventDefault();
			createNote();
		}

		function setStatus(msg, type) {
			apiStatus.textContent = msg;
			apiStatus.className = 'status ' + type;
			if (type === 'ok') setTimeout(() => { apiStatus.textContent = ''; apiStatus.className = 'status'; }, 3000);
		}

		function formatDate(iso) {
			return new Date(iso).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
		}

		function esc(str) {
			return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}

		function connect() {
			const raw = apiUrl.value.trim().replace(/\/$/, '');
			if (!raw) { setStatus('Introduce una URL válida.', 'err'); return; }
			BASE = raw + '/notes';
			loadNotes();
		}

		async function loadNotes() {
			if (!BASE) return;
			try {
				const res = await fetch(BASE);
				if (!res.ok) throw new Error();
				render(await res.json());
				noteForm.submit.disabled = false;
			} catch {
				setStatus('No se pudo conectar con la API.', 'err');
				noteList.setHTMLUnsafe('<p class="muted"><em>Sin conexión.</em></p>');
			}
		}

		function render(notes) {
			if (!notes.length) {
				noteList.setHTMLUnsafe('<p class="muted"><em>No hay notas aún.</em></p>');
				return;
			}
			noteList.setHTMLUnsafe(notes.map(n => `
					<article class="note" id="note-${n.id}">
						<header class="flex">
							<h3>${esc(n.title)}</h3>
							<button class="delete" aria-label="Eliminar nota" onclick="deleteNote('${n.id}')">✕</button>
						</header>
						${n.body ? `<p class="body">${esc(n.body)}</p>` : ''}
						<time datetime="${n.createdAt}">${formatDate(n.createdAt)}</time>
					</article>
				`).join(''));
		}

		async function createNote() {
			const title = noteForm.title.value.trim();
			const body = noteForm.body.value.trim();

			if (!title) { setStatus('El título es obligatorio.', 'err'); return; }

			try {
				noteForm.submit.disabled = true;

				const res = await fetch(BASE, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ title, body })
				});
				if (!res.ok) throw new Error();

				noteForm.title.value = '';
				noteForm.body.value = '';

				setStatus('Nota añadida.', 'ok');
				loadNotes();
			} catch { setStatus('Error al crear la nota.', 'err'); }
		}

		async function deleteNote(id) {
			try {
				const res = await fetch(BASE + '/' + id, { method: 'DELETE' });
				if (!res.ok) throw new Error();

				setStatus('Nota eliminada.', 'ok');
				loadNotes();
			} catch { setStatus('Error al eliminar la nota.', 'err'); }
		}
	</script>
</body>
</html>
